<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Träning">
<meta name="theme-color" content="#FAF3EB">
<title>Träning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#FAF3EB; --card:#FFFDFA; --card-line:#EFE4D8;
  --ink:#3A2A22; --muted:#8B7667; --rust:#A8583E; --rust-ink:#FFFFFF;
  --head-bg:#FAF1E7; --cell-line:#EADFD3; --field:#FAF1E7; --x:#8B7667;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#1C1612; --card:#241D18; --card-line:#3A2F27;
    --ink:#F1E6DB; --muted:#B39E8E; --rust:#D98A6C; --rust-ink:#1C1612;
    --head-bg:#2C231D; --cell-line:#3A2F27; --field:#2C231D; --x:#B39E8E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#1C1612; --card:#241D18; --card-line:#3A2F27;
  --ink:#F1E6DB; --muted:#B39E8E; --rust:#D98A6C; --rust-ink:#1C1612;
  --head-bg:#2C231D; --cell-line:#3A2F27; --field:#2C231D; --x:#B39E8E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--page);color:var(--ink);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rust);outline-offset:2px;border-radius:6px}

.app{max-width:620px;margin:0 auto;padding:22px 14px 110px}

header.top{padding:6px 8px 16px}
header.top h1{
  margin:0;font-family:"Libre Caslon Text",Georgia,"Times New Roman",serif;
  font-weight:700;font-size:2.3rem;line-height:1.1;
}
header.top p{margin:4px 0 0;color:var(--muted)}

.card{
  background:var(--card);border:1px solid var(--card-line);border-radius:28px;
  padding:24px 20px 26px;margin-bottom:16px;
}
.card h2{
  margin:0 0 6px;font-family:"Libre Caslon Text",Georgia,serif;font-weight:700;font-size:1.6rem;
}
.lead{margin:0 0 4px;color:var(--muted);font-size:1.02rem}

.group-title{
  display:flex;align-items:center;justify-content:space-between;
  color:var(--rust);font-weight:700;font-size:1.1rem;margin:22px 0 10px;
}
.group-title:first-of-type{margin-top:10px}

/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border:1px solid var(--cell-line);text-align:left;vertical-align:middle}
th{background:var(--head-bg);color:var(--muted);font-weight:600;font-size:.9rem;padding:12px 10px}
col.c-name{width:38%} col.c-kg{width:33%} col.c-sets{width:29%}
td{padding:0}
.name-cell{display:flex;align-items:center;gap:4px;padding:12px 4px 12px 12px}
.name-cell span{flex:1;min-width:0;overflow-wrap:anywhere}
td textarea{
  display:block;width:100%;border:0;background:transparent;padding:14px 8px 14px 10px;min-height:52px;
  font:inherit;font-size:.95rem;line-height:1.35;color:inherit;resize:none;overflow:hidden;
  font-variant-numeric:tabular-nums;
}
td textarea:focus{outline:none;background:var(--head-bg)}
td textarea::placeholder{color:transparent}
td textarea:focus::placeholder{color:var(--muted)}

.x{
  background:none;border:0;color:var(--x);width:30px;height:30px;flex:none;
  font-size:1.25rem;line-height:1;border-radius:8px;
}
.x:hover{color:var(--rust)}

.add{display:flex;gap:10px;margin-top:14px}
.add input{
  flex:1;min-width:0;background:var(--field);border:1px solid var(--cell-line);
  border-radius:18px;padding:12px 16px;
}
.add input::placeholder{color:var(--muted);opacity:.8}
.add button{
  flex:none;width:56px;border:0;border-radius:16px;background:var(--rust);color:var(--rust-ink);
  font-size:1.4rem;font-weight:500;
}

/* Schedule */
.day{padding:14px 0;border-bottom:1px solid var(--cell-line)}
.day:last-child{border-bottom:0;padding-bottom:0}
.day-head{display:flex;align-items:center;gap:8px}
.day-name{color:var(--rust);font-weight:700;font-size:1.05rem}
.today-tag{font-size:.78rem;font-weight:600;background:var(--rust);color:var(--rust-ink);padding:2px 9px;border-radius:999px}
.day-title-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:2px}
.day-title{font-family:"Libre Caslon Text",Georgia,serif;font-weight:700;font-size:1.35rem}
.link-btn{background:none;border:0;color:var(--muted);font-size:.9rem;text-decoration:underline;padding:4px}
ul.items{list-style:none;margin:8px 0 0;padding:0}
ul.items li{display:flex;align-items:center;gap:8px;padding:4px 0}
ul.items li span{flex:1}
ul.items li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rust);flex:none}
.day .add{margin-top:10px}
.save-btn{width:auto!important;padding:0 16px;font-size:1rem!important;font-weight:600!important}

/* Tabs */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);
  border-top:1px solid var(--card-line);padding-bottom:env(safe-area-inset-bottom,0px);
}
nav.tabs .inner{max-width:620px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
nav.tabs button{
  background:none;border:0;padding:14px 8px 12px;font-weight:600;color:var(--muted);
  border-top:3px solid transparent;
}
nav.tabs button[aria-selected="true"]{color:var(--rust);border-top-color:var(--rust)}
section.panel[hidden]{display:none}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Träning</h1>
    <p id="dateLine"></p>
  </header>
  <section class="panel" id="panel-schema" role="tabpanel"></section>
  <section class="panel" id="panel-tracker" role="tabpanel" hidden></section>
</div>

<nav class="tabs" role="tablist">
  <div class="inner">
    <button role="tab" aria-selected="true" data-tab="schema">Schema</button>
    <button role="tab" aria-selected="false" data-tab="tracker">Tracker</button>
  </div>
</nav>

<script>
(function(){
  const KEY = 'traningsapp-v2';
  const OLD_KEY = 'traningsapp-v1';
  const DAYS = ['Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag','Söndag'];
  const MONTHS = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
  const uid = () => Math.random().toString(36).slice(2,10);
  const ex = (name, kg='', sets='') => ({ id:uid(), name, kg, sets });

  function seedGroups(){
    return [
      { id:uid(), name:'Ben/rumpa', exercises:[
        ex('Hip thrust','30','3×12'),
        ex('Bulgarisk split squat','12,5','3×10'),
        ex('Curtsy lunge'), ex('Sumo squat'), ex('Goblet squat'), ex('Lateral lunges'),
        ex('Hip abductions','29, 36, 36','3–4×12'),
        ex('Hamstring extensions','22, 27','3×12 ish'),
        ex('Backward lunges'),
        ex('Leg press','Max 83',''),
        ex('Kickbacks'), ex('Step ups'),
        ex('Squat','20, 25','3×10–12'),
        ex('Andra leg press','34, 41, 48','3×12'),
        ex('Andra hip abductions','18, 23','3×8–12'),
        ex('Utfallssteg bak','20','3×8–10')
      ]},
      { id:uid(), name:'ABS', exercises:[
        ex('Ab crunch-maskin'), ex('Decline abs'), ex('Decline abs utan vikt'), ex('Ab roller'),
        ex('Weighted leg lowers'), ex('Weighted toe taps'), ex('Sit ups (nudda ett ben)'), ex('Cable crunch')
      ]},
      { id:uid(), name:'Rygg', exercises:[
        ex('Pull ups','','5, 4, 3 st'),
        ex('Breda lats drag','18–23','4×8–12'),
        ex('Smala lats drag'),
        ex('Seated cable row','18–23','4×8–12'),
        ex('Flying raises','3','3×10'),
        ex('Chest openers','3','3×10')
      ]},
      { id:uid(), name:'Armar', exercises:[
        ex('Biceps curls','4'), ex('Upright row'), ex('Lateral raise'), ex('Serve the platter'),
        ex('Overhead hammer press'), ex('Overhead triceps extension'), ex('Triceps extensions'),
        ex('Chair dips'), ex('Hammer curls','3'), ex('Reverse flys'), ex('Bent over rows')
      ]}
    ];
  }
  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){ const d = JSON.parse(raw); if(d && d.schedule && d.groups) return d; }
    }catch(e){}
    let schedule = DAYS.map(() => ({ title:'', items:[] }));
    try{
      const old = JSON.parse(localStorage.getItem(OLD_KEY) || 'null');
      if(old && Array.isArray(old.schedule)) schedule = old.schedule;
    }catch(e){}
    return { schedule, groups: seedGroups() };
  }
  let state = load();
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  save();

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const todayIdx = (new Date().getDay()+6)%7;
  const now = new Date();

  function renderDateLine(){
    const t = state.schedule[todayIdx].title;
    document.getElementById('dateLine').textContent =
      DAYS[todayIdx] + ' ' + now.getDate() + ' ' + MONTHS[now.getMonth()] + (t ? ', idag kör du ' + t.toLowerCase() : '');
  }

  /* ---------- Schema ---------- */
  const editingDay = new Set();
  const schemaEl = document.getElementById('panel-schema');

  function renderSchema(){
    renderDateLine();
    const names = [...new Set(state.groups.flatMap(g => g.exercises.map(x => x.name)))];
    schemaEl.innerHTML = `<div class="card">
      <h2>Träningssplit</h2>
      <p class="lead">Gäller varje vecka tills du ändrar den.</p>
      <datalist id="exNames">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      ${state.schedule.map((day,i) => {
        const editing = editingDay.has(i) || !day.title;
        const titleBlock = editing
          ? `<form class="add" data-act="set-title">
               <input name="text" value="${esc(day.title)}" placeholder="Vad tränar du? T.ex. Ben eller Vila" aria-label="Pass för ${DAYS[i]}">
               <button class="save-btn" type="submit">Spara</button>
             </form>`
          : `<div class="day-title-row">
               <span class="day-title">${esc(day.title)}</span>
               <button class="link-btn" data-act="edit-title">Ändra</button>
             </div>`;
        const exBlock = day.title ? `
          <ul class="items">
            ${day.items.map(it => `<li><span>${esc(it.text)}</span><button class="x" data-act="del-item" data-id="${it.id}" aria-label="Ta bort ${esc(it.text)}">×</button></li>`).join('')}
          </ul>
          <form class="add" data-act="add-item">
            <input name="text" list="exNames" placeholder="Lägg till övning..." aria-label="Ny övning för ${DAYS[i]}">
            <button type="submit" aria-label="Lägg till">+</button>
          </form>` : '';
        return `<div class="day" data-day="${i}">
          <div class="day-head"><span class="day-name">${DAYS[i]}</span>${i===todayIdx?'<span class="today-tag">Idag</span>':''}</div>
          ${titleBlock}${exBlock}
        </div>`;
      }).join('')}
    </div>`;
  }

  schemaEl.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target; const i = +f.closest('.day').dataset.day;
    const text = f.text.value.trim();
    if(f.dataset.act==='set-title'){
      if(!text){ f.text.focus(); return; }
      state.schedule[i].title = text; editingDay.delete(i); save(); renderSchema();
      const next = schemaEl.querySelector(`.day[data-day="${i}"] form[data-act="add-item"] input`); if(next) next.focus();
      return;
    }
    if(!text) return;
    state.schedule[i].items.push({ id:uid(), text }); save(); renderSchema();
    const again = schemaEl.querySelector(`.day[data-day="${i}"] form[data-act="add-item"] input`); if(again) again.focus();
  });
  schemaEl.addEventListener('click', e => {
    const b = e.target.closest('button[data-act]'); if(!b) return;
    const i = +b.closest('.day').dataset.day;
    if(b.dataset.act==='edit-title'){
      editingDay.add(i); renderSchema();
      const inp = schemaEl.querySelector(`.day[data-day="${i}"] form[data-act="set-title"] input`); if(inp){ inp.focus(); inp.select(); }
    }
    if(b.dataset.act==='del-item'){
      state.schedule[i].items = state.schedule[i].items.filter(x => x.id!==b.dataset.id); save(); renderSchema();
    }
  });

  /* ---------- Tracker ---------- */
  const trEl = document.getElementById('panel-tracker');
  const findGroup = id => state.groups.find(g => g.id===id);

  function renderTracker(){
    trEl.innerHTML = `<div class="card">
      <h2>Tracker</h2>
      <p class="lead">Skriv in vikt och sets × reps för varje övning, uppdatera när du gör framsteg. Lägg till nya övningar direkt i tabellen.</p>
      ${state.groups.map(g => `
        <div class="group" data-group="${g.id}">
          <div class="group-title"><span>${esc(g.name)}</span>
            <button class="x" data-act="del-group" aria-label="Ta bort ${esc(g.name)}">×</button></div>
          <div class="table-wrap"><table>
            <colgroup><col class="c-name"><col class="c-kg"><col class="c-sets"></colgroup>
            <thead><tr><th>Övning</th><th>Kg</th><th>Sets × reps</th></tr></thead>
            <tbody>
              ${g.exercises.map(x => `<tr data-ex="${x.id}">
                <td><div class="name-cell"><span>${esc(x.name)}</span>
                  <button class="x" data-act="del-ex" aria-label="Ta bort ${esc(x.name)}">×</button></div></td>
                <td><textarea rows="1" data-field="kg" placeholder="kg" aria-label="Kg för ${esc(x.name)}">${esc(x.kg)}</textarea></td>
                <td><textarea rows="1" data-field="sets" placeholder="3×10" aria-label="Sets och reps för ${esc(x.name)}">${esc(x.sets)}</textarea></td>
              </tr>`).join('')}
            </tbody>
          </table></div>
          <form class="add" data-act="add-ex">
            <input name="text" placeholder="Lägg till övning..." aria-label="Ny övning i ${esc(g.name)}">
            <button type="submit" aria-label="Lägg till">+</button>
          </form>
        </div>`).join('')}
      <div class="group-title" style="margin-top:30px"><span>Ny muskelgrupp</span></div>
      <form class="add" data-act="add-group" style="margin-top:0">
        <input name="text" placeholder="T.ex. Bröst" aria-label="Namn på ny muskelgrupp">
        <button type="submit" aria-label="Lägg till grupp">+</button>
      </form>
    </div>`;
    requestAnimationFrame(fitAll);
  }

  trEl.addEventListener('input', e => {
    const f = e.target.dataset.field; if(!f) return;
    const g = findGroup(e.target.closest('.group').dataset.group);
    const x = g.exercises.find(x => x.id===e.target.closest('tr').dataset.ex);
    x[f] = e.target.value; save(); fit(e.target);
  });
  function fit(t){ t.style.height='auto'; t.style.height=t.scrollHeight+'px'; }
  function fitAll(){ trEl.querySelectorAll('td textarea').forEach(fit); }
  trEl.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.tagName==='TEXTAREA'){ e.preventDefault(); e.target.blur(); } });
  window.addEventListener('resize', fitAll);
  trEl.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target; const text = f.text.value.trim(); if(!text) return;
    if(f.dataset.act==='add-group'){
      state.groups.push({ id:uid(), name:text, exercises:[] }); save(); renderTracker(); return;
    }
    const g = findGroup(f.closest('.group').dataset.group);
    g.exercises.push(ex(text)); save(); renderTracker(); renderSchema();
    const again = trEl.querySelector(`.group[data-group="${g.id}"] form input`); if(again) again.focus();
  });
  trEl.addEventListener('click', e => {
    const b = e.target.closest('button[data-act]'); if(!b) return;
    const g = findGroup(b.closest('.group').dataset.group);
    if(b.dataset.act==='del-group'){
      if(!confirm(`Ta bort ${g.name} och alla övningar i den?`)) return;
      state.groups = state.groups.filter(x => x!==g); save(); renderTracker(); return;
    }
    if(b.dataset.act==='del-ex'){
      const x = g.exercises.find(x => x.id===b.closest('tr').dataset.ex);
      if(!confirm(`Ta bort ${x.name}?`)) return;
      g.exercises = g.exercises.filter(y => y!==x); save(); renderTracker(); renderSchema();
    }
  });

  /* ---------- Tabs ---------- */
  document.querySelectorAll('nav.tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b===btn));
      document.getElementById('panel-schema').hidden = btn.dataset.tab!=='schema';
      document.getElementById('panel-tracker').hidden = btn.dataset.tab!=='tracker';
      window.scrollTo(0,0);
      if(btn.dataset.tab==='tracker') fitAll();
    });
  });

  renderSchema();
  renderTracker();
})();
</script>
</body>
</html>
